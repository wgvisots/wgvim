name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so the fuzzers get regular fresh time even when nothing is pushed.
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The build itself needs no network: every dependency is a checksummed tarball under deps/. The
# network is used only to install the compilers (apt, dnf) and to pull the UBI 9 image.

jobs:
  # AGENTS.md: AI use is disclosed only with a bare "AI-assisted" trailer; no model or service
  # names, links or AI authors. (Ported from Neovim's "no-ai-advertisements" check.)
  commit-messages:
    name: commit messages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Reject AI advertisements in commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
                range="$AFTER^!"
              else
                range="$BEFORE..$AFTER"
              fi ;;
            *) echo "no new commits to check for a $EVENT event"; exit 0 ;;
          esac
          scripts/check-commit-messages.sh "$range"

  ubuntu:
    name: ubuntu (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build gettext cmake build-essential clang clangd man-db inotify-tools

      - name: Verify vendored deps
        run: scripts/verify-deps.sh

      - name: Build
        run: make CMAKE_BUILD_TYPE=Release

      - name: Check hardening
        run: scripts/check-hardening.sh build/bin/wgvim build/compile_commands.json

      - name: Smoke test
        run: scripts/smoke-test.sh build/bin/wgvim

      - name: Lint help pages
        if: matrix.cc == 'gcc'
        run: cmake --build build --target lintdoc

      - name: Functional tests
        run: cmake --build build --target functionaltest

      - name: Old (Vim) tests
        if: success() || failure()
        run: make oldtest

      - name: Upload old-test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oldtest-logs-${{ matrix.cc }}
          path: |
            test/old/testdir/*.log
            test/old/testdir/messages
          if-no-files-found: ignore

  # The same script you run locally: UBI 9 with its own GCC 11 toolchain, the build and the tests
  # in a container started with --network none, non-root. podman is preinstalled on the runner.
  # --package also makes the release tarball from the binary that is tested here, and tests it
  # in a fresh plain UBI 9 container (no compilers, no source tree).
  rhel9:
    name: RHEL 9 (UBI 9 container, offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write      # build attestation of the tarball (pushes to master only)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test in UBI 9
        run: scripts/rhel9-container-test.sh --engine podman --committed --package --out rhel9-results

      - name: Release tarball
        id: tarball
        run: |
          d=$(ls -d rhel9-results/*/package 2>/dev/null | tail -1)
          f=$(ls "$d"/*.tar.gz)
          mkdir -p tarball && cp "$f" "$f.sha256" tarball/
          name=$(basename "$f" .tar.gz)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          { echo "**Release tarball:** \`$name.tar.gz\`"; echo '```'; cat "$f.sha256"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Only on master: attestations are public records, and PR builds are not releases.
      - name: Attest the tarball
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: tarball/*.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.tarball.outputs.name }}
          path: tarball/
          if-no-files-found: error
          retention-days: 90

      - name: Summary
        if: success() || failure()
        run: |
          d=$(ls -d rhel9-results/*/ 2>/dev/null | tail -1)
          [ -n "$d" ] && [ -f "$d/summary.txt" ] || exit 0
          cat "$d/summary.txt"
          { echo '```'; cat "$d/summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$d/functionaltest-failures.txt" ]; then
            echo "::group::Failed functional tests"; cat "$d/functionaltest-failures.txt"; echo
            sed 's/\x1b\[[0-9;]*m//g' "$d/functionaltest.log" | grep -A60 -E '^(FAILED|ERROR) +[^ ]+ @' | head -1500
            echo "::endgroup::"
            { echo '**Failed functional tests**'; echo '```';
              cat "$d/functionaltest-failures.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          for l in package package-hardening check-tarball; do
            f="$d/$l.log"; [ -f "$f" ] || f="$d/$l.txt"
            if [ -f "$f" ] && grep -qE "^(release tarball|tarball hardening|tarball in plain UBI 9) .*(FAIL|CHECK)" "$d/summary.txt"; then
              echo "::group::$l"; cat "$f"; echo "::endgroup::"
            fi
          done
          if grep -q '^old tests .*FAIL' "$d/summary.txt"; then
            echo "::group::Old tests (end of log)"
            if [ -f "$d/oldtest-test.log" ]; then cat "$d/oldtest-test.log"; fi
            sed 's/\x1b\[[0-9;]*m//g' "$d/oldtest.log" | grep -E -A3 'FAILED|Failed|^From ' | tail -80
            echo "::endgroup::"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: rhel9-results
          path: rhel9-results

  # Compiles the SELinux policy module (contrib/selinux) against the RHEL 9 policy. Loading it
  # needs an SELinux-enabled host: see scripts/wgvim-selinux.sh.
  selinux:
    name: SELinux policy (RHEL 9)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: almalinux:9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the policy development files
        run: dnf -y install selinux-policy-devel make

      - name: Build wgvim.pp
        run: scripts/wgvim-selinux.sh build

      # The policy's optional blocks are skipped silently when a type is missing; check that the
      # types it relies on exist in the RHEL 9 targeted policy.
      - name: Check the types the policy relies on
        run: |
          dnf -y install selinux-policy-targeted setools-console
          pol=$(ls /etc/selinux/targeted/policy/policy.* | tail -1)
          for ty in unconfined_t staff_t user_t user_home_t user_tmp_t ssh_home_t gpg_secret_t \
                    config_home_t cache_home_t data_home_t bin_t lib_t usr_t; do
            if seinfo "$pol" -t "$ty" >/dev/null 2>&1 && seinfo "$pol" -t "$ty" | grep -q "$ty"; then
              echo "ok      $ty"
            else
              echo "MISSING $ty"; missing=1
            fi
          done
          [ -z "${missing:-}" ]

  # libFuzzer + ASan/UBSan on the terminal emulator, the terminal input parser, and the
  # Tree-sitter runtime with each bundled parser (test/fuzz/README.md). Replays every corpus
  # input, then fuzzes each harness for a while (the Tree-sitter ones share the job's time).
  # Harper (contrib/harper/, :help wgvim-harper): its dependencies against the RustSec advisory
  # database, and, when the pinned package is in deps/, the binary against its pins and lock
  # file. Weekly too (the schedule above), so new advisories are seen without a push.
  harper:
    name: Harper dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit --version

      - name: Audit contrib/harper/Cargo.lock (RustSec)
        # Fails on any vulnerability not accepted, with a reason, in audit-ignore.txt;
        # unmaintained and unsound crates are reported as warnings.
        run: |
          ignore=$(grep -E '^RUSTSEC-' contrib/harper/audit-ignore.txt | cut -d' ' -f1 | sed 's/^/--ignore /')
          cargo audit --file contrib/harper/Cargo.lock $ignore

      - name: Check the pinned harper-ls (SHA-256 pins, crates vs Cargo.lock)
        if: hashFiles('deps/harper-linux-x64-3.1.0.vsix') != ''
        run: |
          scripts/install-harper.sh
          python3 -I scripts/check-harper.py "$HOME/.local/bin/harper-ls"

  fuzz:
    name: fuzz (${{ matrix.harness }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - harness: vterm
            fuzzers: vterm
            max_len: 8192
          - harness: termkey
            fuzzers: termkey
            max_len: 8192
          - harness: tablefmt
            fuzzers: tablefmt
            max_len: 8192
          - harness: treesitter
            fuzzers: >-
              treesitter_c treesitter_cpp treesitter_diff treesitter_lua treesitter_vim
              treesitter_vimdoc treesitter_query treesitter_markdown treesitter_markdown_inline
            max_len: 4096
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '1800' || '300' }}
      FUZZERS: ${{ matrix.fuzzers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build gettext cmake clang-18 libclang-rt-18-dev

      - name: Build fuzzer
        run: |
          make deps CMAKE_BUILD_TYPE=Release
          cmake -S . -B build-fuzz -G Ninja -D CMAKE_C_COMPILER=clang-18 \
            -D CMAKE_CXX_COMPILER=clang++-18 -D CMAKE_BUILD_TYPE=RelWithDebInfo -D WGVIM_FUZZ=ON -D WGVIM_HARDENING=OFF
          for f in $FUZZERS; do targets="${targets:-} ${f}_fuzzer"; done
          cmake --build build-fuzz --target $targets

      - name: Replay corpus (including past crash inputs)
        run: |
          for f in $FUZZERS; do
            build-fuzz/bin/${f}_fuzzer test/fuzz/corpus/$f/* -runs=0
          done

      - name: Fuzz
        run: |
          n=$(wc -w <<< "$FUZZERS")
          for f in $FUZZERS; do
            mkdir -p corpus/$f artifacts
            cp test/fuzz/corpus/$f/* corpus/$f/
            build-fuzz/bin/${f}_fuzzer corpus/$f -max_total_time=$(( FUZZ_SECONDS / n )) \
              -timeout=10 -max_len=${{ matrix.max_len }} -print_final_stats=1 \
              -artifact_prefix=artifacts/$f-
          done

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.harness }}
          path: artifacts
