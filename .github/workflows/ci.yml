name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so the fuzzers get regular fresh time even when nothing is pushed.
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The build itself needs no network: every dependency is a checksummed tarball under deps/. The
# network is used only to install the compilers (apt, dnf) and to pull the UBI 9 image.

jobs:
  # AGENTS.md: AI use is disclosed only with a bare "AI-assisted" trailer; no model or service
  # names, links or AI authors. (Ported from Neovim's "no-ai-advertisements" check.)
  commit-messages:
    name: commit messages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Reject AI advertisements in commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
                range="$AFTER^!"
              else
                range="$BEFORE..$AFTER"
              fi ;;
            *) echo "no new commits to check for a $EVENT event"; exit 0 ;;
          esac
          scripts/check-commit-messages.sh "$range"

  ubuntu:
    name: ubuntu (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build gettext cmake build-essential clang clangd man-db inotify-tools

      - name: Verify vendored deps
        run: scripts/verify-deps.sh

      - name: Build
        run: make CMAKE_BUILD_TYPE=Release

      - name: Check hardening
        run: scripts/check-hardening.sh build/bin/wgvim build/compile_commands.json

      - name: Smoke test
        run: scripts/smoke-test.sh build/bin/wgvim

      - name: Lint help pages
        if: matrix.cc == 'gcc'
        run: cmake --build build --target lintdoc

      - name: Functional tests
        run: cmake --build build --target functionaltest

      - name: Old (Vim) tests
        if: success() || failure()
        run: make oldtest

      - name: Upload old-test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oldtest-logs-${{ matrix.cc }}
          path: |
            test/old/testdir/*.log
            test/old/testdir/messages
          if-no-files-found: ignore

  # The same script you run locally: UBI 9 with its own GCC 11 toolchain, the build and the tests
  # in a container started with --network none, non-root. podman is preinstalled on the runner.
  rhel9:
    name: RHEL 9 (UBI 9 container, offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test in UBI 9
        run: scripts/rhel9-container-test.sh --engine podman --committed --out rhel9-results

      - name: Summary
        if: success() || failure()
        run: |
          d=$(ls -d rhel9-results/*/ 2>/dev/null | tail -1)
          [ -n "$d" ] && [ -f "$d/summary.txt" ] || exit 0
          cat "$d/summary.txt"
          { echo '```'; cat "$d/summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$d/functionaltest-failures.txt" ]; then
            echo "::group::Failed functional tests"; cat "$d/functionaltest-failures.txt"; echo
            sed 's/\x1b\[[0-9;]*m//g' "$d/functionaltest.log" | grep -A60 -E '^(FAILED|ERROR) +[^ ]+ @' | head -1500
            echo "::endgroup::"
            { echo '**Failed functional tests**'; echo '```';
              cat "$d/functionaltest-failures.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if grep -q '^old tests .*FAIL' "$d/summary.txt"; then
            echo "::group::Old tests (end of log)"
            if [ -f "$d/oldtest-test.log" ]; then cat "$d/oldtest-test.log"; fi
            sed 's/\x1b\[[0-9;]*m//g' "$d/oldtest.log" | grep -E -A3 'FAILED|Failed|^From ' | tail -80
            echo "::endgroup::"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: rhel9-results
          path: rhel9-results

  # Compiles the SELinux policy module (contrib/selinux) against the RHEL 9 policy. Loading it
  # needs an SELinux-enabled host: see scripts/wgvim-selinux.sh.
  selinux:
    name: SELinux policy (RHEL 9)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: almalinux:9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the policy development files
        run: dnf -y install selinux-policy-devel make

      - name: Build wgvim.pp
        run: scripts/wgvim-selinux.sh build

      # The policy's optional blocks are skipped silently when a type is missing; check that the
      # types it relies on exist in the RHEL 9 targeted policy.
      - name: Check the types the policy relies on
        run: |
          dnf -y install selinux-policy-targeted setools-console
          pol=$(ls /etc/selinux/targeted/policy/policy.* | tail -1)
          for ty in unconfined_t staff_t user_t user_home_t user_tmp_t ssh_home_t gpg_secret_t \
                    config_home_t cache_home_t data_home_t bin_t lib_t usr_t; do
            if seinfo "$pol" -t "$ty" >/dev/null 2>&1 && seinfo "$pol" -t "$ty" | grep -q "$ty"; then
              echo "ok      $ty"
            else
              echo "MISSING $ty"; missing=1
            fi
          done
          [ -z "${missing:-}" ]

  # libFuzzer + ASan/UBSan on the terminal emulator and the terminal input parser
  # (test/fuzz/README.md). Replays every corpus input, then fuzzes each harness for a while.
  fuzz:
    name: fuzz (${{ matrix.harness }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        harness: [vterm, termkey]
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '1800' || '300' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build gettext cmake clang-18 libclang-rt-18-dev

      - name: Build fuzzer
        run: |
          make deps CMAKE_BUILD_TYPE=Release
          cmake -S . -B build-fuzz -G Ninja -D CMAKE_C_COMPILER=clang-18 \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo -D WGVIM_FUZZ=ON -D WGVIM_HARDENING=OFF
          cmake --build build-fuzz --target ${{ matrix.harness }}_fuzzer

      - name: Replay corpus (including past crash inputs)
        run: build-fuzz/bin/${{ matrix.harness }}_fuzzer test/fuzz/corpus/${{ matrix.harness }}/* -runs=0

      - name: Fuzz
        run: |
          mkdir -p corpus artifacts
          cp test/fuzz/corpus/${{ matrix.harness }}/* corpus/
          build-fuzz/bin/${{ matrix.harness }}_fuzzer corpus -max_total_time="$FUZZ_SECONDS" \
            -timeout=10 -max_len=8192 -print_final_stats=1 -artifact_prefix=artifacts/

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.harness }}
          path: artifacts
