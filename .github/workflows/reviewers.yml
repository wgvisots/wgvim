name: "reviewers: add"

# Requests a review from the repository owner on new pull requests. Replaces Neovim's
# reviewers_add.yml, which requested Neovim maintainers.
#
# GitHub does not allow a review request to a pull request's own author, so pull requests the
# owner opens are skipped (the owner is already involved). pull_request_target runs the workflow
# from the base branch with a write token; this job never checks out or runs code from the pull
# request.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions: {}

jobs:
  request-reviewer:
    if: >-
      github.event.pull_request.state == 'open' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Request a review from the repository owner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWER: ${{ github.repository_owner }}
        run: gh api --method POST "repos/$GH_REPO/pulls/$PR_NUMBER/requested_reviewers" -f "reviewers[]=$REVIEWER"
